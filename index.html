<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Data Viewer App</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
        darkmode:'class',
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">

  <div class="max-w-6xl mx-auto">
   
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="text-center sm:text-left">
        <h1 class="text-3xl md:text-4xl font-bold text-indigo-400 mb-2">Product Data Viewer</h1>
        <p class="text-slate-400">Dynamic UI & Asynchronous JavaScript Project</p>
      </div>

     
      <button id="themeToggle" class="bg-slate-800 border border-slate-700 px-4 py-2 rounded-lg text-sm flex items-center gap-2">
        <span id="themeIcon">🌙</span> <span id="themeText">Dark Mode</span>
      </button>
    </header>

    <div class="flex flex-col md:flex-row gap-4 justify-between mb-8">
     
      <div class="relative w-full md:w-1/2">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search products..." 
          class="w-full bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:outline-none focus:border-indigo-500 transition"
        >
      </div>

      <select 
        id="categoryFilter" 
        class="bg-slate-800 border border-slate-700 text-white px-4 py-2.5 rounded-lg focus:outline-none focus:border-indigo-500 transition"
      >
        <option value="all">All Categories</option>
        <option value="electronics">Electronics</option>
        <option value="jewelery">Jewelery</option>
        <option value="men's clothing">Men's clothing</option>
        <option value="women's clothing">Women's clothing</option>
      </select>
    </div>

    <div id="errorMessage" class="hidden bg-red-500/20 border border-red-500 text-red-300 p-4 rounded-lg mb-6 text-center"></div>

    <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
