<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Data Viewer - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">

  <nav class="bg-white dark:bg-gray-800 shadow p-4 max-w-6xl mx-auto my-4 rounded-lg flex justify-between items-center">
    <a href="index.html" class="text-xl font-bold text-blue-600 dark:text-blue-400">DataViewer</a>
    <div class="flex items-center gap-4">
      <a href="index.html" class="hover:text-blue-600">Home</a>
      <a href="cart.html" class="hover:text-blue-600">Cart (<span id="cart-count">0</span>)</a>
      <a href="about.html" class="hover:text-blue-600">About</a>
      <button id="theme-toggle" class="p-2 border rounded-lg dark:border-gray-600 hover:bg-gray-200 dark:hover:bg-gray-700">🌙/☀️</button>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto p-4">
    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <input type="text" id="search-input" placeholder="Search products (Debounced)..." class="p-3 border rounded-lg w-full md:w-1/2 dark:bg-gray-800 dark:border-gray-700">
      <select id="category-filter" class="p-3 border rounded-lg w-full md:w-1/2 dark:bg-gray-800 dark:border-gray-700">
        <option value="all">All Categories</option>
      </select>
    </div>

    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
