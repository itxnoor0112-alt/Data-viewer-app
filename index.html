<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Data Viewer - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme.js"></script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200 min-h-screen">
  <div class="flex min-h-screen relative">
    <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 p-6 fixed md:static inset-y-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between">
      <div>
        <div class="flex justify-between items-center mb-8 md:hidden">
          <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400">Dashboard</h2>
          <button id="close-drawer-btn" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-white text-xl font-bold">
            &times;
          </button>
        </div>
        <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400 mb-8 hidden md:block">Dashboard</h2>
        <nav class="space-y-4">
          <a href="index.html" class="flex items-center gap-3 font-semibold text-blue-600 dark:text-blue-400 py-2 px-3 rounded-lg bg-blue-50 dark:bg-gray-700">
            <span>🏠</span> Home
          </a>
          <a href="cart.html" class="flex items-center gap-3 font-medium text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 py-2 px-3 rounded-lg transition">
            <span>🛒</span> My Cart (<span id="cart-badge">0</span>)
          </a>
          <a href="about.html" class="flex items-center gap-3 font-medium text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 py-2 px-3 rounded-lg transition">
            <span>ℹ️</span> About
          </a>
        </nav>
      </div>
    </aside>
    <main class="flex-1 p-6 md:p-8 w-full">
      <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
          <button id="open-drawer-btn" class="md:hidden text-gray-700 dark:text-gray-200 focus:outline-none p-1">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400">DataViewer</h1>
        </div>
        <button id="theme-toggle-btn" class="p-2 rounded-lg bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition text-lg" title="Toggle Light/Dark Theme">
          🌙 / ☀️
        </button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <input id="search-input" type="text" placeholder="Search products (Debounced)..." class="w-full px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">      
        <select id="category-filter" class="w-full px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none shadow-sm">
          <option value="all">ALL</option>
        </select>
        <select id="price-sort" class="w-full px-4 py-2 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg focus:outline-none shadow-sm">
          <option value="default">Sort by Price</option>
          <option value="low-to-high">Price: Low to High</option>
          <option value="high-to-low">Price: High to Low</option>
        </select>
      </div>
      <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
      <div id="pagination-container" class="flex justify-center items-center gap-4 my-8 hidden">
        <button id="prev-page-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg disabled:opacity-50 transition">
          Previous
        </button>
        <span id="page-indicator" class="font-semibold text-gray-700 dark:text-gray-300">
          Page 1 of 1
        </span>
        <button id="next-page-btn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg disabled:opacity-50 transition">
          Next
        </button>
      </div>
    </main>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
