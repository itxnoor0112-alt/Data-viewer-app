<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Dynamic Data Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-200 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex flex-col md:flex-row">
  <div class="md:hidden flex justify-between items-center bg-white dark:bg-gray-800 p-4 shadow-md sticky top-0 z-30">
    <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400">DataViewer</h2>
    <button id="mobile-menu-btn" class="p-2 text-2xl text-gray-700 dark:text-gray-200">☰</button>
  </div>
  <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden"></div>
  <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 shadow-lg h-screen p-4 fixed top-0 left-0 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col justify-between overflow-y-auto">
    <div>
      <div class="flex justify-between items-center mb-8 p-2">
        <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400">Dashboard</h2>
        <button id="close-sidebar-btn" class="md:hidden text-gray-500 text-xl font-bold">&times;</button>
      </div>    
      <nav class="flex flex-col gap-2">
        <a href="index.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          🏠 <span>Home</span>
        </a>
        <a href="cart.html" class="flex items-center gap-3 p-3 rounded-lg bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 font-semibold">
          🛒 <span>My Cart (<span id="sidebar-cart-count">0</span>)</span>
        </a>
        <a href="about.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          ℹ️ <span>About</span>
        </a>
      </nav>
    </div>
  </aside>
  <div class="flex-1 md:ml-64 p-4 md:p-6">
    <div class="flex justify-between items-center max-w-4xl mx-auto mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-blue-600 dark:text-blue-400">Shopping Cart</h1>
      <button id="theme-toggle" class="p-2 border rounded-lg bg-white dark:bg-gray-800 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 shadow-sm">🌙/☀️</button>
    </div>
    <main class="max-w-4xl mx-auto">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700">
        <div id="cart-items-container" class="space-y-4 mb-6"></div>
        <hr class="border-gray-200 dark:border-gray-700 my-4">
        <div class="flex justify-between items-center font-bold text-xl">
          <span>Total Price:</span>
          <span id="cart-total-price" class="text-blue-600 dark:text-blue-400">$0.00</span>
        </div>
        <div class="mt-6 flex justify-end gap-3">
          <button id="clear-cart-btn" class="px-4 py-2 bg-red-100 text-red-600 dark:bg-red-900/30 dark:text-red-400 rounded-lg hover:bg-red-200 transition text-sm font-semibold">Clear Cart</button>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./js/cart.js"></script>
</body>
</html>
