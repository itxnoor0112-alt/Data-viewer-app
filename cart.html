<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen">

  <nav class="bg-white dark:bg-gray-800 shadow p-4 max-w-6xl mx-auto my-4 rounded-lg flex justify-between items-center">
    <a href="index.html" class="text-xl font-bold text-blue-600 dark:text-blue-400">DataViewer</a>
    <div class="flex items-center gap-4">
      <a href="index.html" class="hover:text-blue-600">Back to Shop</a>
      <button id="theme-toggle" class="p-2 border rounded-lg dark:border-gray-600">🌙/☀️</button>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto p-6 bg-white dark:bg-gray-800 rounded-lg shadow mt-6">
    <h1 class="text-2xl font-bold mb-4">Your Cart</h1>
    <div id="cart-items" class="divide-y dark:divide-gray-700"></div>
    <div class="mt-6 flex justify-between items-center border-t dark:border-gray-700 pt-4">
      <span class="text-xl font-bold">Total: $<span id="cart-total">0.00</span></span>
      <button onclick="alert('Order placed successfully!')" class="bg-green-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-700">Checkout</button>
    </div>
  </main>

  <script type="module" src="./js/cart.js"></script>
</body>
</html>
