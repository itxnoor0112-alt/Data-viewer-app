<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - Dynamic Data Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-200 dark:bg-gray-900 text-gray-800 dark:text-gray-100 min-h-screen flex">
  <aside class="w-64 bg-white dark:bg-gray-800 shadow-lg h-screen p-4 fixed top-0 left-0 hidden md:flex flex-col justify-between z-20 overflow-y-auto">
    <div>
      <div class="mb-8 p-2">
        <h2 class="text-xl font-bold text-blue-600 dark:text-blue-400">Dashboard</h2>
      </div>
      <nav class="flex flex-col gap-2">
        <a href="index.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          🏠 <span>Home</span>
        </a>
        <a href="cart.html" class="flex items-center gap-3 p-3 rounded-lg bg-blue-50 dark:bg-gray-700 text-blue-600 dark:text-blue-400 font-semibold">
          🛒 <span>My Cart (<span id="sidebar-cart-count">0</span>)</span>
        </a>
        <a href="about.html" class="flex items-center gap-3 p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
          ℹ️ <span>About</span>
        </a>
      </nav>
    </div>
  </aside>
  <div class="flex-1 md:ml-64 p-6">
    <div class="flex justify-between items-center max-w-4xl mx-auto mb-6">
      <h1 class="text-3xl font-bold text-blue-600 dark:text-blue-400">Shopping Cart</h1>
      <button id="theme-toggle" class="p-2 border rounded-lg bg-white dark:bg-gray-800 dark:border-gray-600 hover:bg-gray-100 dark:hover:bg-gray-700 shadow-sm">🌙/☀️</button>
    </div>
    <main class="max-w-4xl mx-auto">
      <div class="bg-white dark:bg-gray-800 p-6 rounded-xl shadow border border-gray-100 dark:border-gray-700">
        <div id="cart-items-container" class="space-y-4 mb-6">
          <p class="text-gray-500 dark:text-gray-400 text-center py-6">Loading cart...</p>
        </div>
        <hr class="border-gray-200 dark:border-gray-700 my-4">
        <div class="flex justify-between items-center font-bold text-xl">
          <span>Total Amount:</span>
          <span id="cart-total-price" class="text-blue-600 dark:text-blue-400">$0.00</span>
        </div>
      </div>
    </main>
  </div>
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle');
    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        const isDark = document.documentElement.classList.contains('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    }
    if (localStorage.getItem('theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }
    function renderCart() {
      const container = document.getElementById('cart-items-container');
      const totalPriceEl = document.getElementById('cart-total-price');
      const sidebarBadge = document.getElementById('sidebar-cart-count');
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const totalCount = cart.reduce((total, item) => total + (item.quantity || 1), 0);
      if (sidebarBadge) sidebarBadge.textContent = totalCount;
      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray-500 dark:text-gray-400 text-center py-8">Your cart is currently empty.</p>`;
        totalPriceEl.textContent = '$0.00';
        return;
      }
      let grandTotal = 0;
      container.innerHTML = cart.map((item, index) => {
        const itemQty = item.quantity || 1;
        const itemTotal = item.price * itemQty;
        grandTotal += itemTotal;
        return `
          <div class="flex flex-col sm:flex-row items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-4 gap-4">
            <div class="flex items-center gap-4 w-full sm:w-auto">
              <img src="${item.image}" alt="${item.title}" class="w-16 h-16 object-contain bg-white p-2 rounded border border-gray-200">
              <div>
                <h3 class="font-bold text-sm max-w-xs truncate text-gray-800 dark:text-gray-100" title="${item.title}">${item.title}</h3>
                <p class="text-sm text-gray-500 dark:text-gray-400">$${item.price.toFixed(2)} × ${itemQty}</p>
              </div>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-6 w-full sm:w-auto">
              <span class="font-bold text-blue-600 dark:text-blue-400">$${itemTotal.toFixed(2)}</span>
              <button onclick="removeCartItem(${index})" class="px-3 py-1 bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-100 dark:hover:bg-red-800/40 rounded transition font-bold text-sm">
                Remove
              </button>
            </div>
          </div>
        `;
      }).join('');
      totalPriceEl.textContent = `$${grandTotal.toFixed(2)}`;
    }
    window.removeCartItem = function(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    };
    renderCart();
  </script>
</body>
</html>
